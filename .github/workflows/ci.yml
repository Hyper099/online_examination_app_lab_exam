name: Result calculation

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  scoring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Run result calculation script
        run: python result_calculation.py
      - name: Install pytest
        run: python -m pip install pytest
      - name: Run scoring tests
        run: python -m pytest -q
