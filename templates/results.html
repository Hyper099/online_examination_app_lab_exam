{% extends "base.html" %}
{% block title %}Results{% endblock %}
{% block content %}
<h1>Results</h1>
{% if result %}
    <p>Latest score: <strong>{{ result.score }} / {{ result.total }}</strong></p>
{% else %}
    <p>You haven't submitted an exam yet.</p>
{% endif %}
<p><a href="{{ url_for('exam') }}">{{ 'Retake exam' if result else 'Take exam' }}</a></p>
{% endblock %}
